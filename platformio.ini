; chipvibe — one firmware for the LED button grid (ESP32-C3 Super Mini
; + HT16K33 3×3 RGB LED / button board).
;
; There is exactly one env. The game being built is whatever the server
; staged into firmware/current/ (game.h + game_info.h). Keeping the
; build flags identical for every game means switching games only
; recompiles main.cpp — the framework is compiled once, not per game.
;
; Don't run `pio run` by hand unless something is staged; the server
; (or `node server/stage.mjs <slug>`) does that for you.

[platformio]
default_envs = board
src_dir = firmware

[env:board]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
; The Super Mini uses the chip's built-in USB Serial/JTAG (no CH340).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DI2C_SDA=4
    -DI2C_SCL=5
    -I$PROJECT_DIR/firmware/current
    -I$PROJECT_DIR/firmware/board
    -I$PROJECT_DIR/firmware/kit
; Two ~1.9 MB app slots so over-the-air updates can swap images.
board_build.partitions = default.csv
upload_protocol = esptool
upload_speed = 921600
